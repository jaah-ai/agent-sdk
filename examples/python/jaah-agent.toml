# Manifest 2: run `command` from this folder as the engine of the node's ACP host. This folder carries
# `jaah_agent` and `requirements.txt` (its dependencies, hash-pinned, which the node installs here before
# `command` starts) beside agent.py, generated by ../vendor.py (run by check.sh; never committed, never edited
# by hand).
[agent]
manifest = 2
name = "jaah-echo"
display_name = "Echo (Python)"
description = "Reference SDK v2 agent: echoes the prompt, then settles the task."
type = "non_coding"
language = "python"
command = ["python3", "agent.py"]
version = "2.0.0"
maintainer = "@jaah-ai"
personas = ["coder"]
