# Manifest 2: run `command` from this folder as the engine of the node's ACP host. `command` runs agent.mjs:
# agent.ts with the SDK inlined, generated by ../vendor.py (run by check.sh; never committed, never edited by
# hand). Its dependencies stay imports, listed in package.json; the node installs them here from
# package-lock.json before `command` starts.
[agent]
manifest = 2
name = "jaah-echo-ts"
display_name = "Echo (TypeScript)"
description = "Reference SDK v2 agent: echoes the prompt, then settles the task."
type = "non_coding"
language = "typescript"
command = ["node", "agent.mjs"]
version = "2.0.0"
maintainer = "@jaah-ai"
personas = ["coder"]
